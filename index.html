<style>

<body>
<header><div class="logo">⚡</div><div><h1>Flex<em>Lens</em></h1><span>Твоё тело — джойстик. Камера видит каждую ошибку</span></div></header>
<div id="app">
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div id="top"><div id="exName"></div><div class="cnt"><div id="counter"></div><div id="barw"><div id="bar"></div></div></div></div>
      <div id="center"></div>
      <div><div id="banner">Загрузка модели…</div><div id="hold"><div id="holdFill"></div></div></div>
    </div>
    <div id="result"></div>
    <canvas id="fx"></canvas>
    <div id="flDebug"></div>
  </div>
  <aside>
    <div class="card"><div class="tiles">
      <div class="tile"><small>Повторы</small><b id="sOk">0</b></div>
      <div class="tile"><small>Ошибки</small><b id="sErr" style="color:var(--err)">0</b></div>
      <div class="tile hot"><small>Ккал</small><b id="sKcal">0.0</b></div>

    </div></div>
    <div class="card" id="steps"></div>
    <div class="card"><label class="wt">Твой вес, кг <input id="weight" type="number" min="30" max="200"></label>
      <label class="wt" style="margin-top:10px">Уровень <select id="level"><option value="0.6">Лёгкий</option><option value="1" selected>Средний</option><option value="1.5">Сложный</option></select></label>
      <div class="chips" id="chips" style="margin:10px 0"></div><small>Выбери упражнения и уровень до старта. Вес нужен для калорий.</small></div>
    <div class="card"><small>Жест-управление: подними руку выше головы на 1.5 сек — старт.</small>
      <button id="voiceBtn" class="sec">Голосовые подсказки: вкл</button>
      <button id="soundBtn" class="sec">Звуки: вкл</button>
      <button id="fsBtn" class="sec">Полный экран</button>
      <button id="startBtn" class="sec">Старт (запасная кнопка)</button>
      <button id="skipBtn" class="sec">Пропустить упражнение</button></div>
  </aside>
</div>

<script type="module">
let PoseLandmarker, FilesetResolver;

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const TARGET = 5;
let weight = 70; try { weight = +localStorage.getItem("weight") || 70; } catch {}
const kcalOf = (i, sec) => EX[i].met * weight * sec / 3600;      // ккал = MET × вес(кг) × время(ч)
const totalKcal = () => stats.kc.reduce((a, b) => a + b, 0);
let ac = null, soundOn = true, dbgOn = false, fpsN = 0, fps = 0;
function beep(f, d = .12, t = "sine") {
  if (!soundOn) return;
  try { ac = ac || new AudioContext(); ac.resume(); const o = ac.createOscillator(), g = ac.createGain(); o.type = t; o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.stop(ac.currentTime + d); } catch {}
}
function confetti() {
  const c = $("fx"), x = c.getContext("2d"); c.width = c.clientWidth; c.height = c.clientHeight;
  const P = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height * .5, v: 2 + Math.random() * 4, r: 5 + Math.random() * 6, h: Math.random() * 360, s: Math.random() * 2 - 1 }));
  let n = 0; (function f() { x.clearRect(0, 0, c.width, c.height); P.forEach(q => { q.y += q.v; q.x += q.s; x.fillStyle = `hsl(${q.h} 90% 60%)`; x.fillRect(q.x, q.y, q.r, q.r * .6); }); if (++n < 260) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}
function saveHist(e) {
  let h = []; try { h = JSON.parse(localStorage.getItem("fl_hist") || "[]"); } catch {}
  const best = Math.max(0, ...h.map(x => x.score)); h.push(e); h = h.slice(-12);
  try { localStorage.setItem("fl_hist", JSON.stringify(h)); } catch {}
  return { h, best, record: best > 0 && e.score > best };
}
function shareCard(e) {
  const c = document.createElement("canvas"); c.width = c.height = 1080; const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 1080, 1080); g.addColorStop(0, "#2b2470"); g.addColorStop(1, "#0d8f7a"); x.fillStyle = g; x.fillRect(0, 0, 1080, 1080);
  x.fillStyle = "#fff"; x.font = "bold 96px sans-serif"; x.fillText("FlexLens", 80, 160); x.font = "600 44px sans-serif"; x.fillText("Моя тренировка", 80, 230);
  [["Очки", e.score], ["Ккал", e.kcal], ["Точность", e.acc + "%"], ["Техника", e.form + "/100"]].forEach(([k, v], i) => { x.font = "40px sans-serif"; x.fillStyle = "#ffffffaa"; x.fillText(k, 80, 440 + i * 150); x.font = "bold 100px sans-serif"; x.fillStyle = "#fff"; x.fillText(String(v), 480, 460 + i * 150); });
  const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "flexlens.png"; a.click();
}
const ICON = ["🦵", "🙌", "↔️", "💪", "🔥", "🧘"];            // сколько ВЕРНЫХ повторов нужно в каждом упражнении
const HOLD_MS = 1500;        // сколько держать руку для жеста «старт»

// ---------- математика ----------
const ang = (a, b, c) => {
  const v1 = { x: a.x - b.x, y: a.y - b.y }, v2 = { x: c.x - b.x, y: c.y - b.y };
  const m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y) || 1;
  return Math.acos(Math.max(-1, Math.min(1, (v1.x * v2.x + v1.y * v2.y) / m))) * 180 / Math.PI;
};
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
// Для упражнений «боком»: берём ту сторону тела, которую камера видит лучше
function sideOf(p) {
  const L = [11, 13, 15, 23, 25, 27], R = [12, 14, 16, 24, 26, 28], core = [0, 3, 4, 5];
  const vis = ids => Math.min(...ids.filter((_, i) => core.includes(i)).map(i => p[i].v));
  const ids = vis(L) >= vis(R) ? L : R;
  const [sh, el, wr, hip, kn, an] = ids.map(i => p[i]);
  return { sh, el, wr, hip, kn, an, ids, vis: vis(ids) };
}
// Отклонение таза от прямой «плечо–стопа» в долях длины тела: + провис, − таз слишком высоко
function hipDev(s) {
  const dx = s.an.x - s.sh.x; if (Math.abs(dx) < 1) return 0;
  const t = (s.hip.x - s.sh.x) / dx, ly = s.sh.y + t * (s.an.y - s.sh.y);
  return (s.hip.y - ly) / dist(s.sh, s.an);
}

// ---------- упражнения ----------
// step(p, st) -> { live:{t,m}, bad:[индексы точек], rep:{ok,key,msg,bad} | null }
// p — сглаженные точки тела (пиксели), st — состояние упражнения
const EX = [
{
  id: "squat", name: "Приседания", met: 5, sec: 3,
  how: "Встань лицом к камере, ноги на ширину плеч.\nПриседай до угла в коленях около 90°.",
  need: [11, 12, 23, 24, 25, 26, 27, 28],
  needMsg: "Отойди от камеры: в кадре должно быть всё тело от головы до стоп",
  step(p, st) {
    const ka = (ang(p[23], p[25], p[27]) + ang(p[24], p[26], p[28])) / 2;
    const kd = Math.abs(p[25].x - p[26].x), ad = Math.abs(p[27].x - p[28].x), sw = Math.abs(p[11].x - p[12].x);
    st.dbg = `колено ${ka | 0}° | колени/стопы ${(kd / ad).toFixed(2)} | мин ${st.min | 0}°`;
    const o = { live: null, bad: [], rep: null };
    if (st.phase !== "down") {
      o.live = ad < sw * 0.7 ? { t: "warn", m: "Поставь ноги шире — на ширину плеч" } : { t: "info", m: "Присядь: таз вниз и назад" };
      if (ka < 150) { st.phase = "down"; st.min = ka; st.cave = false; }
    } else {
      st.min = Math.min(st.min, ka);
      if (ka < 135 && kd < ad * 0.75) st.cave = true;
      if (st.cave && ka < 150) { o.bad = [25, 26]; o.live = { t: "err", m: "Колени заваливаются внутрь — разведи их в стороны, по линии носков" }; }
      else o.live = ka > 110 ? { t: "info", m: "Ещё ниже — до угла в коленях около 90°" } : { t: "ok", m: "Хорошая глубина — вставай" };
      if (ka > 162) {
        st.phase = "up";
        if (st.cave) o.rep = { ok: false, key: "Колени внутрь", msg: "Колени сходились внутрь. Разводи колени в стороны, чтобы они смотрели в ту же сторону, что и носки.", bad: [25, 26] };
        else if (st.min > 110) o.rep = { ok: false, key: "Мелкий присед", msg: `Присед слишком мелкий: угол в коленях ${Math.round(st.min)}°, нужно 110° или меньше. Отведи таз назад и опустись ниже.`, bad: [23, 24] };
        else o.rep = { ok: true, q: Math.round(Math.max(55, 100 - Math.max(0, st.min - 90) * 2)) };
      }
    }
    return o;
  }
},
{
  id: "arms", name: "Руки вверх", met: 3.5, sec: 3,
  how: "Встань лицом к камере.\nПоднимай обе прямые руки выше головы и опускай вниз.",
  need: [0, 11, 12, 13, 14, 15, 16],
  needMsg: "Отойди назад: должны быть видны голова, плечи, локти и кисти",
  step(p, st) {
    const sm = mid(p[11], p[12]), sw = Math.abs(p[11].x - p[12].x) || 1;
    const lw = p[15], rw = p[16];
    const lowReach = sm.y - Math.max(lw.y, rw.y);     // высота НИЖНЕЙ кисти над плечами
    const hiReach = sm.y - Math.min(lw.y, rw.y);      // высота ВЕРХНЕЙ кисти
    const headReach = sm.y - p[0].y;                  // высота носа над плечами
    const elbow = Math.min(ang(p[11], p[13], p[15]), ang(p[12], p[14], p[16]));
    const lagName = lw.y > rw.y ? "Левая" : "Правая", lagIdx = lw.y > rw.y ? 15 : 16;
    st.dbg = `локоть ${elbow | 0}° | над плечами ${lowReach | 0}/${hiReach | 0}px | голова ${headReach | 0}px`;
    const o = { live: null, bad: [], rep: null };
    if (st.phase !== "up") {
      o.live = { t: "info", m: "Подними обе руки вверх над головой" };
      if (hiReach > 0) { st.phase = "up"; st.best = -1e9; st.elb = 180; st.hi = 0; st.diff = 0; st.lag = ""; st.lagIdx = 15; }
    } else {
      st.hi = Math.max(st.hi, hiReach);
      if (lowReach > st.best) { st.best = lowReach; st.elb = elbow; }
      const d = Math.abs(lw.y - rw.y);
      if (d > st.diff) { st.diff = d; st.lag = lagName; st.lagIdx = lagIdx; }
      if (d > sw * 0.4 && hiReach > 0) { o.bad = [lagIdx]; o.live = { t: "err", m: `${lagName} рука отстаёт — поднимай обе руки одновременно` }; }
      else if (lowReach > headReach * 0.9 && elbow < 145) { o.bad = [13, 14]; o.live = { t: "err", m: "Выпрями локти — руки должны быть прямыми" }; }
      else if (lowReach < headReach) o.live = { t: "info", m: "Выше — кисти должны быть выше головы" };
      else o.live = { t: "ok", m: "Верхняя точка — опускай руки" };
      if (hiReach < 0) {
        st.phase = "down";
        if (st.hi < sw * 0.3) return o;               // случайное движение — не считаем
        if (st.best < headReach) o.rep = { ok: false, key: "Руки низко", msg: "Руки не дошли до верха: подними обе кисти выше уровня головы.", bad: [15, 16] };
        else if (st.diff > sw * 0.4) o.rep = { ok: false, key: "Руки несинхронно", msg: `${st.lag} рука отставала. Поднимай и опускай руки синхронно, в одном темпе.`, bad: [st.lagIdx] };
        else if (st.elb < 145) o.rep = { ok: false, key: "Согнуты локти", msg: `Локти согнуты (${Math.round(st.elb)}° вместо 160°+). Вытягивай руки полностью вверх.`, bad: [13, 14] };
        else o.rep = { ok: true, q: Math.round(Math.max(55, 100 - Math.max(0, 170 - st.elb) * 1.5)) };
      }
    }
    return o;
  }
},
{
  id: "bend", name: "Наклоны в стороны", met: 2.5, sec: 3,
  how: "Встань прямо, ноги на ширину плеч.\nНаклоняй корпус влево и вправо по очереди, таз не двигай.",
  need: [11, 12, 23, 24, 27, 28],
  needMsg: "Отойди от камеры: в кадре должно быть всё тело",
  step(p, st) {
    const sm = mid(p[11], p[12]), hm = mid(p[23], p[24]), am = mid(p[27], p[28]);
    const sw = Math.abs(p[11].x - p[12].x) || 1;
    const tilt = Math.atan2(sm.x - hm.x, hm.y - sm.y) * 180 / Math.PI;   // >0 = влево (со стороны человека)
    st.dbg = `наклон ${tilt.toFixed(1)}° | пик ${(st.peak || 0).toFixed(1)}°`;
    const o = { live: null, bad: [], rep: null };
    if (st.phase !== "bend") {
      st.base = hm.x - am.x;
      const next = st.last === 1 ? "вправо" : st.last === -1 ? "влево" : "в сторону";
      o.live = { t: "info", m: `Наклонись ${next}, корпус ровно, без поворота` };
      if (Math.abs(tilt) > 9) { st.phase = "bend"; st.peak = Math.abs(tilt); st.side = Math.sign(tilt); st.drift = false; }
    } else {
      st.peak = Math.max(st.peak, Math.abs(tilt));
      if (Math.abs(hm.x - am.x - st.base) > sw * 0.35) st.drift = true;
      if (st.drift && Math.abs(tilt) > 9) { o.bad = [23, 24]; o.live = { t: "err", m: "Таз уходит в сторону — держи таз над стопами, наклоняйся только корпусом" }; }
      else o.live = st.peak < 18 ? { t: "info", m: "Ниже — наклонись сильнее (нужно 18° и больше)" } : { t: "ok", m: "Отлично — возвращайся в центр" };

  const opts = d => ({ baseOptions: { modelAssetPath: model, delegate: d }, runningMode: "VIDEO", numPoses: 1 });

  catch { return await PoseLandmarker.createFromOptions(fs, opts("CPU")); }
}
let loopOn = false;
async function init() {
  phase = "loading"; $("startBtn").textContent = "Старт (запасная кнопка)";
  // 1) камера
  setBanner("", "Включаю камеру… Если браузер спросит — нажми «Разрешить»");
  try {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    const stream = await openCamera();
    video.srcObject = stream;
    if (video.readyState < 1) await new Promise(r => video.addEventListener("loadedmetadata", r, { once: true }));
    await video.play().catch(() => {});
    canvas.width = video.videoWidth || 960; canvas.height = video.videoHeight || 720;
    stream.getVideoTracks()[0].addEventListener("ended", () => { phase = "error"; setBanner("err", "Камера отключилась. Подключи её и нажми «Повторить запуск»."); $("startBtn").textContent = "Повторить запуск"; });
  } catch (err) {
    phase = "error"; $("startBtn").textContent = "Повторить запуск";
    const msg = err.name === "Insecure" ? "Браузер даёт камеру только сайтам на https:// или localhost. Сейчас адрес страницы: " + location.origin + ". Открой сайт по https (например, GitHub Pages / Netlify) или запусти локально через localhost."
      : err.name === "NoApi" ? "Этот браузер не даёт доступ к камере. Открой сайт в обычном Chrome, Edge или Safari (не во встроенном браузере Telegram/Instagram)."
      : camError(err);
    setBanner("err", msg); console.error(err); return;
  }
  // 2) модель распознавания позы
  if (!landmarker) {
    setBanner("", "Камера работает ✓ Загружаю модель распознавания тела…");
    try { landmarker = await loadVision(); }
    catch (err) {
      phase = "error"; $("startBtn").textContent = "Повторить запуск"; console.error(err);
      setBanner("err", "Камера работает, но не загрузилась модель распознавания тела (нужен интернет: cdn.jsdelivr.net и storage.googleapis.com). Проверь интернет/VPN и нажми «Повторить запуск». (" + (err && err.message || err) + ")");
      return;
    }
  }
  stats = newStats(); renderSide(); phase = "menu";
  if (!loopOn) { loopOn = true; loop(); }
}
$("voiceBtn").onclick = e => { voice = !voice; e.target.textContent = "Голосовые подсказки: " + (voice ? "вкл" : "выкл"); if (!voice) speechSynthesis.cancel(); };
$("startBtn").onclick = () => { if (phase === "error") init(); else if (phase === "menu" || phase === "result") begin(); };
$("skipBtn").onclick = () => { if (phase === "active" || phase === "ready") nextExercise(); };
$("weight").value = weight;
$("weight").onchange = e => { weight = Math.min(200, Math.max(30, +e.target.value || 70)); e.target.value = weight; try { localStorage.setItem("weight", weight); } catch {} };
setInterval(() => { if (stats && ["ready", "active", "between"].includes(phase)) { const t = Math.round((performance.now() - stats.t0) / 1000); $("sTime").textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); } }, 500);
$("chips").innerHTML = EX.map((e, i) => `<label><input type="checkbox" data-i="${i}" checked>${ICON[i]} ${e.name}</label>`).join("");
$("chips").onchange = ev => { const i = +ev.target.dataset.i; sel[i] = ev.target.checked; if (!sel.some(Boolean)) { sel[i] = true; ev.target.checked = true; } if (stats) renderSide(); };
$("level").onchange = e => { LV = +e.target.value; applyLevel(); if (stats) renderSide(); };
$("soundBtn").onclick = e => { soundOn = !soundOn; e.target.textContent = "Звуки: " + (soundOn ? "вкл" : "выкл"); };
$("fsBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen() : $("stage").requestFullscreen();
addEventListener("keydown", e => { if (["INPUT", "SELECT"].includes(e.target.tagName)) return; if (e.key.toLowerCase() === "d" || e.key.toLowerCase() === "в") { dbgOn = !dbgOn; $("flDebug").style.display = dbgOn ? "block" : "none"; } });
setInterval(() => { fps = fpsN; fpsN = 0; }, 1000);
init();
</script>
