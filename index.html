<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131118">
<title>FlexLens — тренер через веб-камеру</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:ital,wght@0,600;0,800;1,800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131118;        /* графит */
  --s1:#1B1922;        /* панели */
  --s2:#24212D;        /* элементы внутри панелей */
  --s3:#2F2B3A;        /* hover / поля */
  --line:#2E2A38;
  --ink:#F4F2F7;
  --mute:#9C97A8;
  --amber:#FFB020;     /* акцент — как цифры на спортивных часах */
  --amber-ink:#1E1400;
  --amber-soft:#FFB02018;
  --ok:#3DDC84;
  --err:#FF4D4F;
  --info:#6CB6FF;
  --num:"Fira Sans Extra Condensed","Arial Narrow",sans-serif;
  --txt:"Onest",system-ui,sans-serif;
  --r-l:20px;--r-m:14px;--r-s:10px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--txt);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* шапка */
header{max-width:1280px;margin:0 auto;padding:20px 24px 0;display:flex;align-items:center;gap:14px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center}
.mark .pic{width:24px;height:24px;stroke-width:2.4}
header h1{margin:0;font:italic 800 30px/1 var(--num);letter-spacing:.005em}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
body.live .status i{background:var(--ok);box-shadow:0 0 0 4px #3DDC8426}
body.live .status span::after{content:"Камера работает"}
body:not(.live) .status span::after{content:"Камера выключена"}
@media(max-width:640px){header p,.status{display:none}}

#app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;max-width:1280px;margin:0 auto;padding:18px 24px 40px}
@media(max-width:960px){#app{grid-template-columns:1fr}}
@media(max-width:560px){#app,header{padding-left:14px;padding-right:14px}}

/* сцена */
#stage{position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--s1);border:1px solid var(--line)}
#stage:fullscreen{display:flex;flex-direction:column;border-radius:0;border:0}
.cam{position:relative;aspect-ratio:4/3;background:#000}
#stage:fullscreen .cam{flex:1;aspect-ratio:auto}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,#00000073);pointer-events:none}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;padding:18px;z-index:1}
#exName{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:var(--amber-ink);font:800 21px/1 var(--num);padding:8px 16px 8px 10px;border-radius:999px}
#exName .pic{width:24px;height:24px;stroke-width:2.3}
#exName:empty{display:none}
#center{margin:auto;align-self:center;max-width:min(500px,92%);background:#1B1922F0;border:1px solid var(--line);color:var(--ink);border-radius:var(--r-m);padding:22px 26px;font-size:16px;line-height:1.5;white-space:pre-line;text-align:center;color:#D9D5E0}
#center::first-line{font:800 30px/1.3 var(--num);color:var(--ink)}
#center:empty{display:none}

/* табло */
.board{display:grid;grid-template-columns:auto 1fr;min-height:92px;border-top:1px solid var(--line)}
.score{padding:14px 22px;display:flex;flex-direction:column;justify-content:center;min-width:160px;border-right:1px solid var(--line)}
#counter{font:italic 800 58px/.95 var(--num);color:var(--amber);font-variant-numeric:tabular-nums}
#counter:empty::before{content:"0/0";color:var(--s3)}
#barw{height:6px;background:var(--s2);margin-top:10px;border-radius:9px;overflow:hidden}
#bar{height:100%;width:0;background:var(--amber);border-radius:9px;transition:width .35s ease}
.msg{display:flex;flex-direction:column;justify-content:center;padding:12px 18px}
#banner{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:500;line-height:1.35;color:var(--ink)}
#banner::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--mute)}
#banner.info::before{background:var(--info)}
#banner.ok::before{background:var(--ok);box-shadow:0 0 0 5px #3DDC8426}
#banner.warn::before{background:var(--amber);box-shadow:0 0 0 5px var(--amber-soft)}
#banner.err{background:var(--err);color:#fff;border-radius:var(--r-s);padding:12px 14px;font-weight:600}
#banner.err::before{background:#fff}
#hold{height:6px;background:var(--s2);border-radius:9px;overflow:hidden;margin-top:10px;display:none}
#holdFill{height:100%;width:0;background:var(--amber)}
@media(max-width:560px){.board{grid-template-columns:1fr}.score{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:16px}#barw{flex:1;margin:0}#counter{font-size:44px}#banner{font-size:15px}}

/* итоги */
#result{position:absolute;inset:0;background:var(--s1);color:var(--ink);padding:28px;overflow:auto;display:none;z-index:4}
.tag{font:italic 800 40px/1.05 var(--num);margin:0 0 20px;color:var(--amber)}
#result h3{font:800 22px/1.2 var(--num);margin:26px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--s2);border-radius:var(--r-m);padding:14px 16px}
.tile small{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13px}
.tile b{display:block;margin-top:4px;font:italic 800 36px/1 var(--num);font-variant-numeric:tabular-nums}
.tile.hot b{color:var(--amber)}
.list{list-style:none;padding:0;margin:6px 0 12px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li span:last-child{color:var(--mute);text-align:right;max-width:62%}
.list .ln{display:inline-flex;align-items:center;gap:10px;font-weight:500}
.list .pic{color:var(--amber)}
.hint{color:var(--mute);margin:18px 0 4px}
.hist{display:flex;gap:6px;align-items:flex-end;height:70px;margin:10px 0 12px}
.hist i{flex:1;background:var(--s3);border-radius:6px 6px 3px 3px}
.hist i:last-child{background:var(--amber)}
#result button{width:auto;display:inline-flex;margin-right:8px;padding:12px 20px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}#result{padding:20px}}

/* боковая колонка */
aside{display:flex;flex-direction:column;gap:14px;align-self:start}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.panel h2{font:600 13px/1 var(--txt);color:var(--mute);margin:2px 2px 12px}
aside .tiles{grid-template-columns:1fr 1fr;gap:8px}
aside .tile{padding:12px 14px}
aside .tile b{font-size:32px}

/* план */
#steps{display:flex;flex-direction:column;gap:4px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:8px;border-radius:var(--r-m);color:var(--mute)}
.step.cur{background:var(--s2);color:var(--ink)}
.ic{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;color:var(--mute)}
.step.cur .ic{background:var(--amber);color:var(--amber-ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.row b{font-weight:600}
.row span{font:italic 800 17px/1 var(--num);font-variant-numeric:tabular-nums}
.step.cur .row span{color:var(--amber)}
.pb{height:4px;background:var(--s3);border-radius:9px;margin-top:7px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--amber);border-radius:9px}

/* настройки */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:14px}
input[type=number]{font:600 15px var(--txt);color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;width:92px;text-align:right}
input[type=number]:focus{border-color:var(--amber);outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s2);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg label{text-align:center;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:500;color:var(--mute);cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1px #ffffff14}
.seg label:has(input:focus-visible){outline:2px solid var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips label{position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--s2);border:1px solid transparent;font-size:13px;font-weight:500;color:var(--mute);cursor:pointer;user-select:none}
.chips .pic{width:18px;height:18px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--amber-soft);border-color:#FFB02066;color:var(--ink)}
.chips label:has(input:checked) .pic{color:var(--amber)}
.chips label:has(input:focus-visible){outline:2px solid var(--amber);outline-offset:2px}
small{color:var(--mute);font-size:12.5px}

/* кнопки */
button{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;font:600 15px var(--txt);border-radius:var(--r-m);padding:12px 14px;cursor:pointer;border:1px solid var(--line);background:var(--s2);color:var(--ink);transition:background .15s,transform .1s}
button:hover{background:var(--s3)}
button:active{transform:scale(.98)}
button + button{margin-top:8px}
button.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-size:16px;font-weight:700;padding:15px}
button.primary:hover{background:#FFC04D}
.toggle{justify-content:flex-start;background:transparent;border:0;padding:10px 4px;border-radius:var(--r-s);color:var(--ink);font-weight:500}
.toggle:hover{background:var(--s2)}
.toggle + .toggle{margin-top:0}
.toggle.plain::after{display:none}
.toggle .i{color:var(--mute)}
.toggle span{flex:1;text-align:left}
.toggle::after{content:"";width:40px;height:24px;border-radius:999px;background:var(--s3);flex:none;background-image:radial-gradient(circle at 12px 12px,#fff 8px,transparent 8.5px);background-repeat:no-repeat;transition:background-color .2s,background-position .2s}
.toggle[aria-pressed=true]::after{background-color:var(--amber);background-position:16px 0}
.sep{height:1px;background:var(--line);margin:12px 0}
.note{margin:12px 2px 0;font-size:12.5px;color:var(--mute);line-height:1.45}

#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#flDebug{position:absolute;left:12px;bottom:12px;background:#000c;color:#fff;font:12px/1.5 monospace;padding:8px 10px;border-radius:8px;display:none;white-space:pre;z-index:6}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="mark"><svg class="pic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6.2" r="2.2" fill="currentColor" stroke="none"/><path d="M12 8.6V15l-2.5 6M12 15l2.5 6M12 10.2L8 3.5M12 10.2l4-6.7"/></svg></div>
  <div><h1>FlexLens</h1><p>Тренер через веб-камеру: считает повторы и поправляет технику</p></div>
  <div class="status"><i></i><span></span></div>
</header>
<div id="app">
  <main>
    <div id="stage">
      <div class="cam">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="hud"><div id="exName"></div><div id="center"></div></div>
        <div id="flDebug"></div>
      </div>
      <div class="board">
        <div class="score"><div id="counter"></div><div id="barw"><div id="bar"></div></div></div>
        <div class="msg"><div id="banner" role="status">Загрузка модели…</div><div id="hold"><div id="holdFill"></div></div></div>
      </div>
      <div id="result"></div>
      <canvas id="fx"></canvas>
    </div>
  </main>
  <aside>
    <section class="panel">
      <div class="tiles">
        <div class="tile"><small><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>Повторы</small><b id="sOk">0</b></div>
        <div class="tile"><small><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Ошибки</small><b id="sErr" style="color:var(--err)">0</b></div>
        <div class="tile hot"><small><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4.5 3-6.5.5 2 1.5 3 3 3 0-3-1-5 0-7.5z"/></svg>Ккал</small><b id="sKcal">0.0</b></div>
        <div class="tile"><small><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Время</small><b id="sTime">0:00</b></div>
      </div>
    </section>
    <section class="panel"><h2>План тренировки</h2><div id="steps"></div></section>
    <section class="panel">
      <h2>Настройки</h2>
      <label class="field">Твой вес, кг <input id="weight" type="number" min="30" max="200"></label>
      <div class="seg" id="level" role="radiogroup" aria-label="Уровень">
        <label><input type="radio" name="level" value="0.6">Лёгкий</label>
        <label><input type="radio" name="level" value="1" checked>Средний</label>
        <label><input type="radio" name="level" value="1.5">Сложный</label>
      </div>
      <div class="chips" id="chips"></div>
      <small>Вес нужен, чтобы посчитать калории.</small>
    </section>
    <section class="panel">
      <button id="startBtn" class="primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></svg><span>Начать тренировку</span></button>
      <button id="skipBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l9 7-9 7z" fill="currentColor" stroke="none"/><path d="M18 5v14"/></svg><span>Пропустить упражнение</span></button>
      <div class="sep"></div>
      <button id="voiceBtn" class="toggle" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11h-9l-5 4v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span>Голосовые подсказки</span></button>
      <button id="soundBtn" class="toggle" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11h-9l-5 4v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span>Голос: вкл</span></button><button id="soundBtn" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg><span>Звуки</span></button>
      <button id="fsBtn" class="toggle plain"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Полный экран</span></button>
      <p class="note">Можно без мыши: подними руку над головой и подержи 1,5 секунды.</p>
    </section>
  </aside>
</div>

<script type="module">
let PoseLandmarker, FilesetResolver;

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const TARGET = 5;
let weight = 70; try { weight = +localStorage.getItem("weight") || 70; } catch {}
const kcalOf = (i, sec) => EX[i].met * weight * sec / 3600;      // ккал = MET × вес(кг) × время(ч)
const totalKcal = () => stats.kc.reduce((a, b) => a + b, 0);
let ac = null, soundOn = true, dbgOn = false, fpsN = 0, fps = 0;
function beep(f, d = .12, t = "sine") {
  if (!soundOn) return;
  try { ac = ac || new AudioContext(); ac.resume(); const o = ac.createOscillator(), g = ac.createGain(); o.type = t; o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.stop(ac.currentTime + d); } catch {}
}
function confetti() {
  const c = $("fx"), x = c.getContext("2d"); c.width = c.clientWidth; c.height = c.clientHeight;
  const P = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height * .5, v: 2 + Math.random() * 4, r: 5 + Math.random() * 6, h: Math.random() * 360, s: Math.random() * 2 - 1 }));

}
function saveHist(e) {
  let h = []; try { h = JSON.parse(localStorage.getItem("fl_hist") || "[]"); } catch {}
  const best = Math.max(0, ...h.map(x => x.score)); h.push(e); h = h.slice(-12);
  try { localStorage.setItem("fl_hist", JSON.stringify(h)); } catch {}
  return { h, best, record: best > 0 && e.score > best };
}
function shareCard(e) {
  const c = document.createElement("canvas"); c.width = c.height = 1080; const x = c.getContext("2d");
  const F = '"Fira Sans Extra Condensed", sans-serif'; x.fillStyle = "#131118"; x.fillRect(0, 0, 1080, 1080); x.fillStyle = "#FFB020"; x.fillRect(80, 300, 140, 10);
  x.fillStyle = "#fff"; x.font = "italic 800 120px " + F; x.fillText("FlexLens", 80, 180); x.font = "600 48px " + F; x.fillText("Моя тренировка", 80, 250);
  [["Очки", e.score], ["Ккал", e.kcal], ["Точность", e.acc + "%"], ["Техника", e.form + "/100"]].forEach(([k, v], i) => { x.font = "600 44px " + F; x.fillStyle = "#ffffffb0"; x.fillText(k, 80, 440 + i * 150); x.font = "italic 800 120px " + F; x.fillStyle = "#FFB020"; x.fillText(String(v), 480, 460 + i * 150); });
  const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "flexlens.png"; a.click();
}
// Пиктограммы упражнений (свои SVG, линии — currentColor)
const PICS = {
  squat: '<circle cx="12" cy="4.2" r="2.2" fill="currentColor" stroke="none"/><path d="M12 6.6L10 12.6l5.6.4-1 6.6M11.4 8.6h6"/>',
  arms: '<circle cx="12" cy="6.2" r="2.2" fill="currentColor" stroke="none"/><path d="M12 8.6V15l-2.5 6M12 15l2.5 6M12 10.2L8 3.5M12 10.2l4-6.7"/>',
  bend: '<circle cx="9.3" cy="5.2" r="2.2" fill="currentColor" stroke="none"/><path d="M10 7.5l2.2 7-2.2 6.5M12.2 14.5l2.6 6.5M10.7 9.3L13.6 4M11.3 10.4l3.9 2.6"/>',
  pushup: '<circle cx="5" cy="9.5" r="2.2" fill="currentColor" stroke="none"/><path d="M7.2 10.3L21 15l.3 2M8.6 10.8V17M3 19h19"/>',
  situp: '<circle cx="6.8" cy="8.3" r="2.2" fill="currentColor" stroke="none"/><path d="M8.3 10.6L12 17.5l4-5 4 5.5M9.3 12.4h5M2.5 19h19"/>',
  plank: '<circle cx="4.8" cy="10.8" r="2.2" fill="currentColor" stroke="none"/><path d="M7.1 11.4L21 14.2l.3 2.3M8.3 11.8v4.8H13M3 18.5h19"/>'
};
const pic = id => `<svg class="pic" viewBox="0 0 24 24" aria-hidden="true">${PICS[id]}</svg>`;
function setEx(e) { if ($("exName").dataset.id !== e.id) { $("exName").innerHTML = pic(e.id) + "<span>" + e.name + "</span>"; $("exName").dataset.id = e.id; } }
function clearEx() { $("exName").innerHTML = ""; delete $("exName").dataset.id; }
const HOLD_MS = 1500;        // сколько держать руку для жеста «старт»

// ---------- математика ----------
const ang = (a, b, c) => {
  const v1 = { x: a.x - b.x, y: a.y - b.y }, v2 = { x: c.x - b.x, y: c.y - b.y };
  const m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y) || 1;
  return Math.acos(Math.max(-1, Math.min(1, (v1.x * v2.x + v1.y * v2.y) / m))) * 180 / Math.PI;
};
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
// Для упражнений «боком»: берём ту сторону тела, которую камера видит лучше
function sideOf(p) {
  const L = [11, 13, 15, 23, 25, 27], R = [12, 14, 16, 24, 26, 28], core = [0, 3, 4, 5];
  const vis = ids => Math.min(...ids.filter((_, i) => core.includes(i)).map(i => p[i].v));
  const ids = vis(L) >= vis(R) ? L : R;
  const [sh, el, wr, hip, kn, an] = ids.map(i => p[i]);
  return { sh, el, wr, hip, kn, an, ids, vis: vis(ids) };
}
// Отклонение таза от прямой «плечо–стопа» в долях длины тела: + провис, − таз слишком высоко
function hipDev(s) {
  const dx = s.an.x - s.sh.x; if (Math.abs(dx) < 1) return 0;
  const t = (s.hip.x - s.sh.x) / dx, ly = s.sh.y + t * (s.an.y - s.sh.y);
  return (s.hip.y - ly) / dist(s.sh, s.an);
}

  const histHtml = `<small>Последние тренировки (очки)</small><div class="hist">${h.map(x => `<i style="height:${Math.max(6, x.score / mx * 60)}px" title="${x.score}"></i>`).join("")}</div>`;
  $("result").innerHTML = `<h2 class="tag">${record ? "Новый рекорд" : "Тренировка завершена"}</h2>
    <div class="tiles"><div class="tile"><small>Очки</small><b>${score}</b></div><div class="tile"><small>Точность</small><b>${acc}%</b></div><div class="tile"><small>Техника</small><b>${form}</b></div><div class="tile"><small>Рекорд</small><b>${Math.max(score, best)}</b></div><div class="tile hot"><small>Сожжено, ккал</small><b>${totalKcal().toFixed(1)}</b></div><div class="tile"><small>Время</small><b>${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}</b></div></div>
    <ul class="list">${EX.map((e, i) => !sel[i] ? "" : `<li><span class="ln">${pic(e.id)}${e.name}</span><span>${e.unit ? `${stats.ok[i]} с из ${e.target}` : `верных ${stats.ok[i]}`} · ошибок ${stats.err[i]} · ${stats.kc[i].toFixed(1)} ккал</span></li>`).join("")}</ul>
    <h3>${mist.length ? "Над чем поработать" : "Ошибок не было — отличная техника!"}</h3>
    <ul class="list">${mist.map(m => `<li><span><b>${m.key}</b> ×${m.n}</span><span>${m.msg}</span></li>`).join("")}</ul>
    ${histHtml}<small>Калории — оценка по формуле MET × вес × время, точность около ±20%.</small>
    <p class="hint">Подними руку выше головы на 1.5 сек, чтобы повторить</p><button id="againBtn" class="primary">Начать заново</button><button id="shareBtn">Скачать карточку результата</button>`;
  $("result").style.display = "block";
  $("againBtn").onclick = begin; $("shareBtn").onclick = () => shareCard(entry);
  confetti(); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .2), i * 140));
  clearEx(); $("counter").textContent = "";
  speak(`Готово. Ваш результат: ${score} очков, точность ${acc} процентов. Сожжено около ${Math.round(totalKcal())} калорий.`);
}

// ---------- жест «рука вверх» = кнопка ----------
function handGesture(p, now) {
  const up = p && p[0].v > .5 && ((p[15].v > .5 && p[15].y < p[0].y - 10) || (p[16].v > .5 && p[16].y < p[0].y - 10));
  $("hold").style.display = "block";
  if (up) { holdStart = holdStart || now; const k = Math.min(1, (now - holdStart) / HOLD_MS); $("holdFill").style.width = k * 100 + "%"; if (k >= 1) { holdStart = 0; $("holdFill").style.width = "0"; return true; } }
  else { holdStart = 0; $("holdFill").style.width = "0"; }
  return false;
}

// ---------- рисование ----------
function draw(p, bad) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!p) return;
  const badSet = new Set(bad || []);
  ctx.lineWidth = 4; ctx.lineCap = "round";
  for (const { start: a, end: b } of PoseLandmarker.POSE_CONNECTIONS) {
    if (a < 11 || b < 11 || p[a].v < .4 || p[b].v < .4) continue;
    ctx.strokeStyle = badSet.has(a) || badSet.has(b) ? "#FF4D4F" : "#ffffffE6";
    ctx.beginPath(); ctx.moveTo(p[a].x, p[a].y); ctx.lineTo(p[b].x, p[b].y); ctx.stroke();
  }
  p.forEach((q, i) => {
    if (i !== 0 && i < 11 || q.v < .4) return;
    const isBad = badSet.has(i);
    ctx.fillStyle = isBad ? "#FF4D4F" : "#FFB020"; ctx.beginPath(); ctx.arc(q.x, q.y, isBad ? 12 : 6, 0, 7); ctx.fill();
  });
}

// ---------- главный цикл ----------
let lastT = -1;
function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2 || video.currentTime === lastT) return;
  lastT = video.currentTime;
  const now = performance.now();
  const res = landmarker.detectForVideo(video, now); fpsN++;
  let p = null;
  if (res.landmarks && res.landmarks[0]) {
    const raw = res.landmarks[0].map(l => ({ x: l.x * canvas.width, y: l.y * canvas.height, v: l.visibility ?? 1 }));
    sm = sm ? raw.map((q, i) => ({ x: sm[i].x * .5 + q.x * .5, y: sm[i].y * .5 + q.y * .5, v: q.v })) : raw;   // сглаживание
    p = sm;
  } else sm = null;

  let bad = [];
  if (phase === "menu") {
    setBanner(p ? "info" : "warn", p ? "Подними руку выше головы и держи 1.5 сек — начнём" : "Встань перед камерой так, чтобы было видно тело");
    $("center").textContent = `Готов к тренировке\nВыбери упражнения справа и встань так, чтобы камера видела тебя целиком`;
    if (handGesture(p, now)) begin();
  } else if (phase === "ready") {
    const e = EX[idx], left = Math.ceil((readyUntil - now) / 1000);
    setEx(e);
    $("hold").style.display = "none";
    $("center").textContent = `${e.name}\nУпражнение ${sel.slice(0, idx + 1).filter(Boolean).length} из ${sel.filter(Boolean).length}\n\n${e.how}\n\nСтарт через ${Math.max(left, 0)}`;
    setBanner("info", "Займи стартовую позицию");
    if (now >= readyUntil) { phase = "active"; st = {}; $("center").textContent = ""; setEx(e); speak(e.name + ". Начали!"); }
  } else if (phase === "active") {
    const e = EX[idx];
    $("hold").style.display = "none";
    setEx(e); $("counter").textContent = `${stats.ok[idx]}/${e.target || TARGET}${e.unit || ""}`; $("bar").style.width = Math.min(100, stats.ok[idx] / (e.target || TARGET) * 100) + "%";
    if (!p || !e.need.every(i => p[i].v > .5)) { setBanner("warn", p ? e.needMsg : "⏸ Пауза — вернись в кадр"); st.lastNow = 0; }
    else {
      st.dt = st.lastNow ? Math.min(0.25, (now - st.lastNow) / 1000) : 0; st.lastNow = now;
      const o = e.step(p, st); bad = o.bad;
      if (o.secs !== undefined && o.secs !== stats.ok[idx]) { stats.kc[idx] += kcalOf(idx, o.secs - stats.ok[idx]); stats.ok[idx] = o.secs; renderSide(); }
      if (o.rep) {
        if (o.rep.ok) { stats.ok[idx]++; stats.kc[idx] += kcalOf(idx, e.sec); renderSide(); const q = o.rep.q ?? 90; stats.q.push(q); beep(880); setTimeout(() => beep(1175), 110); flash = { t: q >= 80 ? "ok" : "warn", m: `Верно! Техника ${q}/100${q < 80 ? " — можно чище" : ""} · повтор ${stats.ok[idx]}/${e.target} · ${totalKcal().toFixed(1)} ккал` }; }
        else {
          stats.err[idx]++; bad = o.rep.bad;
          const m = stats.mistakes[e.id + o.rep.key] ||= { key: o.rep.key, n: 0, msg: o.rep.msg }; m.n++; m.msg = o.rep.msg;
          stats.q.push(35); beep(200, .25, "sawtooth"); flash = { t: "err", m: o.rep.msg }; speak(o.rep.msg);
        }
        flashUntil = now + 3000; renderSide();
      }
      if (stats.ok[idx] >= e.target) { if (e.unit) stats.q.push(Math.max(40, 100 - stats.err[idx] * 15)); beep(1320, .2); setTimeout(nextExercise, 900); phase = "between"; }
      const show = now < flashUntil ? flash : o.live;
      if (show) { setBanner(show.t, show.m); if (show.t === "err" && !o.rep) speak(show.m); }
    }
  } else if (phase === "result") {
    if (handGesture(p, now)) begin();
  }
  if (dbgOn) $("flDebug").textContent = `${phase} · ${EX[idx] ? EX[idx].id : "-"} · fps ${fps}\nфаза: ${st.phase || "-"}\n${st.dbg || ""}`;
  draw(p, bad);
}

// ---------- запуск ----------
// Понятный текст для каждой причины, почему камера не запустилась
function camError(err) {
  const n = err && err.name;
  if (n === "NotAllowedError" || n === "SecurityError") return "Камера запрещена. Нажми на значок замка/камеры слева от адреса сайта → «Разрешить камеру», затем нажми «Повторить запуск». Если запрет стоит в Windows: Параметры → Конфиденциальность → Камера → разрешить приложениям и браузеру.";
  if (n === "NotFoundError" || n === "OverconstrainedError") return "Камера не найдена. Проверь, что веб-камера подключена и включена (на ноутбуке бывает кнопка/шторка на камере или клавиша F-ряда).";
  if (n === "NotReadableError" || n === "AbortError") return "Камера занята другой программой (Zoom, Discord, Telegram, OBS, другая вкладка). Закрой их и нажми «Повторить запуск».";
  return "Не удалось включить камеру: " + (err && err.message || err);
}
async function openCamera() {
  if (!window.isSecureContext) throw { name: "Insecure" };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: "NoApi" };
  // Сначала с желаемым разрешением, если не вышло — с любыми настройками камеры
  const tries = [{ width: { ideal: 960 }, height: { ideal: 720 }, facingMode: "user" }, { facingMode: "user" }, true];
  let last;
  for (const v of tries) {
    try { return await navigator.mediaDevices.getUserMedia({ video: v, audio: false }); }
    catch (e) { last = e; if (e.name === "NotAllowedError" || e.name === "SecurityError") break; }
  }
  throw last;
}
async function loadVision() {
  // Сначала локальные файлы (работает без интернета), потом два разных CDN
  const libs = ["./vendor", "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14", "https://unpkg.com/@mediapipe/tasks-vision@0.10.14"];
  let lib = null, lastErr;
  for (const l of libs) {
    try { ({ PoseLandmarker, FilesetResolver } = await import(l + "/vision_bundle.mjs")); lib = l; break; } catch (e) { lastErr = e; }
  }
  if (!lib) throw lastErr;
  let model = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  try { if ((await fetch("./models/pose_landmarker_lite.task", { method: "HEAD" })).ok) model = "./models/pose_landmarker_lite.task"; } catch {}
  const fs = await FilesetResolver.forVisionTasks(lib + "/wasm");
  const opts = d => ({ baseOptions: { modelAssetPath: model, delegate: d }, runningMode: "VIDEO", numPoses: 1 });
  try { return await PoseLandmarker.createFromOptions(fs, opts("GPU")); }
  catch { return await PoseLandmarker.createFromOptions(fs, opts("CPU")); }
}
let loopOn = false;
async function init() {
  phase = "loading"; $("startBtn").querySelector("span").textContent = "Начать тренировку";
  // 1) камера
  setBanner("", "Включаю камеру… Если браузер спросит — нажми «Разрешить»");
  try {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    const stream = await openCamera();
    video.srcObject = stream;
    if (video.readyState < 1) await new Promise(r => video.addEventListener("loadedmetadata", r, { once: true }));
    await video.play().catch(() => {});
    canvas.width = video.videoWidth || 960; canvas.height = video.videoHeight || 720; document.body.classList.add("live");
    stream.getVideoTracks()[0].addEventListener("ended", () => { phase = "error"; document.body.classList.remove("live"); setBanner("err", "Камера отключилась. Подключи её и нажми «Повторить запуск»."); $("startBtn").querySelector("span").textContent = "Повторить запуск"; });
  } catch (err) {
    phase = "error"; $("startBtn").querySelector("span").textContent = "Повторить запуск";
    const msg = err.name === "Insecure" ? "Браузер даёт камеру только сайтам на https:// или localhost. Сейчас адрес страницы: " + location.origin + ". Открой сайт по https (например, GitHub Pages / Netlify) или запусти локально через localhost."
      : err.name === "NoApi" ? "Этот браузер не даёт доступ к камере. Открой сайт в обычном Chrome, Edge или Safari (не во встроенном браузере Telegram/Instagram)."
      : camError(err);
    setBanner("err", msg); console.error(err); return;
  }
  // 2) модель распознавания позы
  if (!landmarker) {
    setBanner("", "Камера работает ✓ Загружаю модель распознавания тела…");
    try { landmarker = await loadVision(); }
    catch (err) {
      phase = "error"; $("startBtn").querySelector("span").textContent = "Повторить запуск"; console.error(err);
      setBanner("err", "Камера работает, но не загрузилась модель распознавания тела (нужен интернет: cdn.jsdelivr.net и storage.googleapis.com). Проверь интернет/VPN и нажми «Повторить запуск». (" + (err && err.message || err) + ")");
      return;
    }
  }
  stats = newStats(); renderSide(); phase = "menu";
  if (!loopOn) { loopOn = true; loop(); }
}
$("voiceBtn").onclick = () => { voice = !voice; const b = $("voiceBtn"); b.setAttribute("aria-pressed", voice); if (!voice) speechSynthesis.cancel(); };
$("startBtn").onclick = () => { if (phase === "error") init(); else if (phase === "menu" || phase === "result") begin(); };
$("skipBtn").onclick = () => { if (phase === "active" || phase === "ready") nextExercise(); };
$("weight").value = weight;
$("weight").onchange = e => { weight = Math.min(200, Math.max(30, +e.target.value || 70)); e.target.value = weight; try { localStorage.setItem("weight", weight); } catch {} };
setInterval(() => { if (stats && ["ready", "active", "between"].includes(phase)) { const t = Math.round((performance.now() - stats.t0) / 1000); $("sTime").textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); } }, 500);
$("chips").innerHTML = EX.map((e, i) => `<label><input type="checkbox" data-i="${i}" checked>${pic(e.id)}${e.name}</label>`).join("");
$("chips").onchange = ev => { const i = +ev.target.dataset.i; sel[i] = ev.target.checked; if (!sel.some(Boolean)) { sel[i] = true; ev.target.checked = true; } if (stats) renderSide(); };
$("level").onchange = e => { LV = +e.target.value; applyLevel(); if (stats) renderSide(); };
$("soundBtn").onclick = () => { soundOn = !soundOn; const b = $("soundBtn"); b.setAttribute("aria-pressed", soundOn); };
$("fsBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen() : $("stage").requestFullscreen();
addEventListener("keydown", e => { if (["INPUT", "SELECT"].includes(e.target.tagName)) return; if (e.key.toLowerCase() === "d" || e.key.toLowerCase() === "в") { dbgOn = !dbgOn; $("flDebug").style.display = dbgOn ? "block" : "none"; } });
setInterval(() => { fps = fpsN; fpsN = 0; }, 1000);
init();
</script>
</body>
